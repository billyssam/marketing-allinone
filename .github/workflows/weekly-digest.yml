name: 주간 다이제스트

# 매주 월요일 09:00 KST(00:00 UTC 월) — 전 매장 주간 리포트를 이슈로 받는다.
#
# 왜 이슈인가: 사장님께 리포트를 전달하려면 알림톡·카톡 채널 credential이 필요한데
# 아직 없다. 파일럿 규모(수 매장)에선 **운영자가 월요일에 카톡으로 복사해 보내는 것**이
# 가장 확실하고, GitHub 이슈는 알림 메일이 바로 오므로 추가 설정 없이 그 경로가 된다.
# (알림톡이 열리면 이 스크립트 출력을 그대로 발송으로 바꾸면 된다)
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 의존성 설치 (워크스페이스)
        run: npm install

      - name: 매장별 주간 리포트 생성
        working-directory: backend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx src/weekly-digest.ts | tee /tmp/digest.txt

      - name: 이슈로 전달
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="📬 주간 다이제스트 — $(TZ=Asia/Seoul date +%Y-%m-%d)"
          {
            echo '각 매장 블록의 평문을 그대로 사장님 카톡에 붙여넣으시면 됩니다.'
            echo '🔴=부정 리뷰 미답변 · ⚠️=할 일 있음 · ✅=깨끗함'
            echo
            echo '```'
            cat /tmp/digest.txt
            echo '```'
          } > /tmp/body.md
          gh issue create -R "${{ github.repository }}" --title "$TITLE" --body-file /tmp/body.md
