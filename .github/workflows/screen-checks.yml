name: 화면 검증 (가짜 대량 데이터)

# 실사용자가 없으니 화면은 늘 **비어 있는 상태**로만 검증돼 왔다.
# "빈 화면이 잘 뜬다"는 채워졌을 때 맞는다는 뜻이 아니다 — 실제로 채워 넣자 하루에 결함 6건이 나왔다
# (부정 미답이 목록에서 사라짐 · 완료 취소 불가 · 단골 KPI가 표본 계산 · 버린 글을 성과로 셈).
#
# 그 검증을 **사람이 기억해서 돌리지 않아도** 되게 여기 붙인다.
# 화면·공용 로직이 바뀔 때마다 자동으로 돌고, 무인 기간에도 하루 한 번 확인한다.
on:
  push:
    branches: [master]
    # 화면·공용 로직·검증 스크립트가 바뀔 때만. 문서만 고친 커밋으로는 안 돈다.
    paths:
      - 'web/src/**'
      - 'shared/**'
      - 'backend/src/test-*.ts'
      - '.github/workflows/screen-checks.yml'
  schedule:
    - cron: '0 6 * * *' # 15:00 KST — 아침 크론(07:30·09:30)과 여정 검증(13:00) 뒤
  workflow_dispatch: {}

concurrency:
  group: screen-checks
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 의존성 설치 (워크스페이스)
        run: npm install

      # 여정 검증과 같은 캐시 키 — 브라우저를 두 번 받지 않는다
      - name: Playwright 브라우저 캐시
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Playwright Chromium 설치
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      # ⚠️ 세 검증은 **각자 다른 이름의 검증 매장**을 쓴다(reply-test / regulars-test / dash-test).
      #    여정 검증(sim-owner / sim-online)과도 겹치지 않는다 — 겹치면 서로의 계정을 지운다.
      #    실사용자 데이터는 이름이 정확히 일치할 때만 지우므로 절대 안 건드린다.
      - name: 답글 경로 (리뷰 120건)
        working-directory: backend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MASK_STORE_NAMES: 'true'
        shell: bash
        run: |
          set -o pipefail
          npx tsx src/test-reply-flow.ts --url=https://marketing-allinone.vercel.app 2>&1 | tee -a /tmp/screens.log

      - name: 단골·리포트 (단골 529명 · 글 3개월)
        if: ${{ !cancelled() }}
        working-directory: backend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MASK_STORE_NAMES: 'true'
        shell: bash
        run: |
          set -o pipefail
          npx tsx src/test-regulars-report.ts --url=https://marketing-allinone.vercel.app 2>&1 | tee -a /tmp/screens.log

      # 확장 다리 — 붙여넣기를 버튼 하나로 바꾸는 경로.
      # ⚠️ Chrome이 확장을 싣는 것과 네이버 에디터 주입은 여기서 못 본다(README에 명시).
      #    여기서 지키는 건 **규약**이다: 확장 없으면 버튼이 안 뜨고, 있으면 채널에 맞는 버튼이 뜬다.
      - name: 확장 다리 (블로그·플레이스 원클릭)
        if: ${{ !cancelled() }}
        working-directory: backend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MASK_STORE_NAMES: 'true'
        shell: bash
        run: |
          set -o pipefail
          npx tsx src/test-extension-bridge.ts --url=https://marketing-allinone.vercel.app 2>&1 | tee -a /tmp/screens.log

      - name: 대시보드 (보관분 섞인 글 36건 · 리뷰 150건)
        if: ${{ !cancelled() }}
        working-directory: backend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MASK_STORE_NAMES: 'true'
        shell: bash
        run: |
          set -o pipefail
          npx tsx src/test-dashboard.ts --url=https://marketing-allinone.vercel.app 2>&1 | tee -a /tmp/screens.log

      # 취소·타임아웃으로 스크립트의 finally 가 안 돌면 검증 매장이 남는다.
      # 남으면 **다음 아침 크론이 그 매장 글을 만들며 Gemini 쿼터를 쓴다** → 반드시 지운다.
      - name: 검증 데이터 정리 (항상)
        if: always()
        working-directory: backend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MASK_STORE_NAMES: 'true'
        run: |
          npx tsx src/test-reply-flow.ts --cleanup-only || true
          npx tsx src/test-regulars-report.ts --cleanup-only || true
          npx tsx src/test-dashboard.ts --cleanup-only || true
          npx tsx src/test-extension-bridge.ts --cleanup-only || true

      # 결과를 런 요약에 남긴다 — 로그를 뒤지지 않고 한눈에 본다(공개 저장소라 상호는 안 찍힌다)
      - name: 결과 요약
        if: always()
        run: |
          {
            echo '## 화면 검증 결과'
            echo '```'
            grep -E '^\s+(✅|🔴)|^검증 ' /tmp/screens.log 2>/dev/null || echo '(로그 없음 — 설치 단계에서 실패했을 수 있음)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 실패 알림 — 이슈 생성
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="🔴 화면 검증 실패 — $(TZ=Asia/Seoul date +%Y-%m-%d)"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          FAILED=$(grep -E '^\s+🔴' /tmp/screens.log 2>/dev/null | head -10 || echo '(요약 없음)')
          BODY=$(printf '데이터가 쌓인 상태에서 화면이 틀린 숫자를 말하거나 할 일을 놓치고 있습니다.\n\n```\n%s\n```\n\n재현: `cd backend && npx tsx src/test-reply-flow.ts --url=https://marketing-allinone.vercel.app`\n(단골=test-regulars-report.ts · 대시보드=test-dashboard.ts, `--keep` 로 데이터를 남겨 눈으로 볼 수 있습니다)\n\n로그: %s' "$FAILED" "$RUN_URL")
          COUNT=$(gh issue list -R "${{ github.repository }}" --state open --search "\"$TITLE\" in:title" --json number --jq 'length')
          if [ "$COUNT" = "0" ]; then
            gh issue create -R "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi

      # 고쳐졌는데 빨간 이슈가 남아 있으면 다음부터 알림을 안 보게 된다(다른 워크플로와 같은 방식)
      - name: 통과 시 지난 알림 닫기
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for N in $(gh issue list -R "${{ github.repository }}" --state open --search "\"화면 검증 실패\" in:title" --json number --jq '.[].number'); do
            gh issue close "$N" -R "${{ github.repository }}" \
              --comment "✅ 화면 검증 통과 — 데이터가 쌓인 상태에서도 숫자·목록이 맞습니다. 자동으로 닫습니다."
          done
