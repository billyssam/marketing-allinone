name: 아침 준비 검증

# 매일 09:30 KST(00:30 UTC) — 크론 성공/실패가 아니라 "사장님 아침에 초안이
# 실제로 DB에 있는가"(비즈니스 SLA)를 직접 확인하는 최종 방어선.
# 07:30 본생성 + 08:30 재시도가 다 지나간 뒤에 돈다.
on:
  schedule:
    - cron: '30 0 * * *'
    # GitHub 크론은 피크 시간대 드롭이 잦다(실측: 첫날 00:30분 미발화).
    # 검증은 읽기전용·멱등이라 2차 스케줄로 드롭 내성 확보.
    - cron: '30 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 의존성 설치 (워크스페이스)
        run: npm install

      - name: 오늘 초안 존재 검증 (연결 매장 전수)
        working-directory: backend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # pipefail 없으면 tee의 종료코드가 스크립트 실패를 가려 실패가 성공으로 찍힌다
        run: |
          set -o pipefail
          npx tsx src/check-morning-ready.ts 2>&1 | tee /tmp/morning.log

      - name: 실패 알림 — 이슈 생성
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="🔴 아침 초안 미준비 — $(TZ=Asia/Seoul date +%Y-%m-%d)"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # 원인을 본문에 넣는다 — '누락'과 '품질 이상'은 조치가 다른데
          # 예전엔 둘 다 "초안이 없습니다"로 나가서 로그를 열어야만 알 수 있었다(2026-08-13).
          SUMMARY=$(grep -E '검증 매장|누락|품질' /tmp/morning.log 2>/dev/null | tail -5 || echo '(요약 없음)')
          BODY=$(printf '자동 알림: 아침 초안 검증이 실패했습니다.\n\n```\n%s\n```\n\n- **초안 누락**이면: Actions → 데일리 콘텐츠 생성 → Run workflow (멱등이라 안전)\n- **품질 이상**이면: 초안은 있으나 분량·사실·조사 규칙에 걸린 것. 로그에서 채널·규칙을 확인하고 재생성.\n\n로그: %s' "$SUMMARY" "$RUN_URL")
          COUNT=$(gh issue list -R "${{ github.repository }}" --state open --search "\"$TITLE\" in:title" --json number --jq 'length')
          if [ "$COUNT" = "0" ]; then
            gh issue create -R "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi

      # 고쳐졌는데 빨간 이슈가 남아 있으면 다음부터 알림을 안 보게 된다(인증 점검과 같은 방식)
      - name: 통과 시 지난 알림 닫기
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for N in $(gh issue list -R "${{ github.repository }}" --state open --search "\"아침 초안 미준비\" in:title" --json number --jq '.[].number'); do
            gh issue close "$N" -R "${{ github.repository }}" \
              --comment "✅ 아침 초안 검증 통과 — 초안 실존·품질 모두 정상입니다. 자동으로 닫습니다."
          done
