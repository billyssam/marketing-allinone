name: 데일리 콘텐츠 생성

# 매일 07:30 KST(22:30 UTC 전날) 예약 — GitHub 크론은 1~2시간 지연이 흔해서
# 여유를 두어야 "아침 9시엔 준비돼 있음"이 지연에도 지켜짐. 멱등(오늘 데일리 있으면 스킵).
on:
  schedule:
    - cron: '30 22 * * *'
    # 자가치유 재시도(1시간 뒤): 1차가 실패/부분실패해도 멱등 스킵 덕에
    # 성공 매장은 노옵, 실패 매장만 다시 생성된다.
    - cron: '30 23 * * *'
  workflow_dispatch: {}

concurrency:
  group: daily-content
  cancel-in-progress: false

# 실패 알림(이슈 생성 → 소유자 이메일)용 최소 권한
permissions:
  contents: read
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    # 매장 수 증가 + RPM 페이싱(매장당 15s) + 429 재시도(65s) 헤드룸
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 의존성 설치 (워크스페이스)
        run: npm install

      - name: 데일리 초안 생성
        working-directory: backend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npx tsx src/generate-daily.ts

      # 24/7 무인 운영: 실패하면 GitHub 이슈 생성 → 소유자에게 이메일 알림.
      # 같은 날 중복 이슈는 만들지 않는다(재시도 크론과 공존).
      - name: 실패 알림 — 이슈 생성
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="🔴 데일리 콘텐츠 크론 실패 — $(TZ=Asia/Seoul date +%Y-%m-%d)"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY=$(printf '자동 알림: 데일리 초안 생성이 실패했습니다. 재시도 크론(08:30 KST)이 자가치유를 시도하지만, 그것까지 실패하면 사장님들 아침 초안이 비어 있을 수 있습니다.\n\n로그: %s' "$RUN_URL")
          COUNT=$(gh issue list -R "${{ github.repository }}" --state open --search "\"$TITLE\" in:title" --json number --jq 'length')
          if [ "$COUNT" = "0" ]; then
            gh issue create -R "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi
