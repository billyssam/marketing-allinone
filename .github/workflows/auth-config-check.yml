name: 인증 설정 점검

# 매일 05:30 KST(20:30 UTC 전날) — 생존확인(06:00)보다 먼저.
#
# 왜 별도 워크플로인가:
#   "서버가 살아있는가"와 "가입·로그인·비밀번호 재설정이 실제로 되는가"는 다른 문제다.
#   Supabase는 허용목록에 없는 리다이렉트 주소를 에러 없이 Site URL로 바꿔치기하기 때문에
#   앱은 200을 뱉고 헬스체크도 통과하는데 사장님이 받는 메일 링크만 죽는다.
#   화면·테스트·빌드 어디에도 안 잡히는 종류라 설정 자체를 매일 실측한다.
on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 의존성 설치 (워크스페이스)
        run: npm install

      - name: 인증 설정 실측 (리다이렉트 허용목록 + 메일 도달)
        working-directory: backend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # SMTP를 붙인 뒤 repo variable로 true를 주면 메일 항목이 통과로 바뀐다
          CUSTOM_SMTP_CONFIGURED: ${{ vars.CUSTOM_SMTP_CONFIGURED }}
          # 'invite'면 자가가입을 의도적으로 닫은 운영 모드로 보고 메일 항목을 통과시킨다
          OWNER_SIGNUP_MODE: ${{ vars.OWNER_SIGNUP_MODE }}
        run: npx tsx src/check-auth-config.ts

      - name: 실패 알림 — 이슈 생성(누적 금지)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 다른 워크플로와 달리 제목에 날짜를 넣지 않는다.
          # 인증 설정은 "그날의 사건"이 아니라 고쳐질 때까지 계속되는 **상태**라,
          # 날짜를 넣으면 매일 새 이슈가 생겨 8/20까지 십수 건이 쌓인다(실제로 이틀 만에 2건).
          # 열린 게 있으면 새로 만들지 않고 코멘트로 "아직 그대로"만 남긴다.
          TITLE="🔴 인증 설정 문제 (가입·로그인·비밀번호 재설정)"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          EXISTING=$(gh issue list -R "${{ github.repository }}" --state open --search "\"인증 설정 문제\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment -R "${{ github.repository }}" "$EXISTING" \
              --body "$(printf '%s 점검 — 아직 해결되지 않았습니다.\n\n로그: %s' "$TODAY" "$RUN_URL")"
          else
            BODY=$(printf '자동 알림: 가입·로그인·비밀번호 재설정 경로에 설정 문제가 있습니다. 헬스체크는 통과하지만 사장님이 받는 메일 링크가 죽거나 가입 자체가 막히는 상태일 수 있습니다.\n\n**고치면 이 이슈는 다음 점검(매일 05:30 KST)에서 자동으로 닫힙니다.**\n\n로그에 원인과 조치 방법이 그대로 적혀 있습니다: %s' "$RUN_URL")
            gh issue create -R "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi

      - name: 해결 시 이슈 자동 닫기
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 사장님이 대시보드에서 고치면 사람 손 없이 닫힌다 — 열린 채 방치되면 다음부터 무시하게 된다.
          for N in $(gh issue list -R "${{ github.repository }}" --state open --search "\"인증 설정 문제\" in:title" --json number --jq '.[].number'); do
            gh issue close -R "${{ github.repository }}" "$N" \
              --comment "✅ 인증 설정 점검 통과 — 리다이렉트 허용목록·메일 도달 모두 정상입니다. 자동으로 닫습니다."
          done
