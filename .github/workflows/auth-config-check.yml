name: 인증 설정 점검

# 매일 05:30 KST(20:30 UTC 전날) — 생존확인(06:00)보다 먼저.
#
# 왜 별도 워크플로인가:
#   "서버가 살아있는가"와 "가입·로그인·비밀번호 재설정이 실제로 되는가"는 다른 문제다.
#   Supabase는 허용목록에 없는 리다이렉트 주소를 에러 없이 Site URL로 바꿔치기하기 때문에
#   앱은 200을 뱉고 헬스체크도 통과하는데 사장님이 받는 메일 링크만 죽는다.
#   화면·테스트·빌드 어디에도 안 잡히는 종류라 설정 자체를 매일 실측한다.
on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 의존성 설치 (워크스페이스)
        run: npm install

      - name: 인증 설정 실측 (리다이렉트 허용목록 + 메일 도달)
        working-directory: backend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # SMTP를 붙인 뒤 repo variable로 true를 주면 메일 항목이 통과로 바뀐다
          CUSTOM_SMTP_CONFIGURED: ${{ vars.CUSTOM_SMTP_CONFIGURED }}
        run: npx tsx src/check-auth-config.ts

      - name: 실패 알림 — 이슈 생성
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="🔴 인증 설정 문제 — $(TZ=Asia/Seoul date +%Y-%m-%d)"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY=$(printf '자동 알림: 가입·로그인·비밀번호 재설정 경로에 설정 문제가 있습니다. 헬스체크는 통과하지만 사장님이 받는 메일 링크가 죽거나 가입 자체가 막히는 상태일 수 있습니다.\n\n로그에 원인과 조치 방법이 그대로 적혀 있습니다: %s' "$RUN_URL")
          COUNT=$(gh issue list -R "${{ github.repository }}" --state open --search "\"$TITLE\" in:title" --json number --jq 'length')
          if [ "$COUNT" = "0" ]; then
            gh issue create -R "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi
