name: 코드 품질 검증
on:
  pull_request: {}
  push:
    branches: [master]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # Only trusted master pushes receive these existing operation secrets.
      # PR jobs never receive them; this check makes no notification/API calls.
      - name: 운영 푸시 키 구성 확인 (발송 없음)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node --import tsx backend/src/check-push-config.ts
