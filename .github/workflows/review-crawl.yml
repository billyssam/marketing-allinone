name: 리뷰 자동 수집

# 매일 09:00 KST(00:00 UTC) 리뷰 크롤 → 감정분석 → reviews 저장 → 부정리뷰 텔레그램 알림.
# 부수효과: 매일 DB 쓰기 활동 → Supabase 무료 프로젝트 자동 일시정지 방지.
on:
  schedule:
    # 09:00 / 12:00 / 18:00 KST — 신규 온보딩 매장도 몇 시간 내 리뷰·플레이스 사실 확보
    # (리뷰 upsert·플레이스 7일 체크 모두 멱등이라 추가 실행 무해)
    - cron: '0 0 * * *'
    - cron: '0 3 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch: {} # 수동 실행(테스트)용

concurrency:
  group: review-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 의존성 설치 (워크스페이스)
        run: npm install

      - name: Playwright Chromium 설치
        run: npx playwright install --with-deps chromium

      - name: 리뷰 크롤 실행
        working-directory: backend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npx tsx src/crawl-reviews.ts

      - name: 플레이스 정보 크롤 (메뉴·영업시간 → 콘텐츠 사실 주입, 7일 멱등)
        working-directory: backend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx src/crawl-place.ts
