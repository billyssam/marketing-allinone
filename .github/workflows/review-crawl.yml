name: 리뷰 자동 수집

# 매일 09:00 KST(00:00 UTC) 리뷰 크롤 → 감정분석 → reviews 저장 → 부정리뷰 텔레그램 알림.
# 부수효과: 매일 DB 쓰기 활동 → Supabase 무료 프로젝트 자동 일시정지 방지.
on:
  schedule:
    # 09·14·19·23시 KST(하루 4회). UTC로는 0,5,10,14시.
    #
    # 왜 4회인가 — **청구는 실행시간이 아니라 작업당 분 단위 올림**이다.
    # 회차가 133초여도 3분으로 청구된다. 이걸 놓치고 2시간 간격(8회/일)으로 올렸다가
    # 이 저장소만으로 월 ~1,080분을 쓰게 됐고, 계정 무료 2,000분의 대부분을 먹었다.
    # (2026-08-22 Actions 예산 $0 차단으로 전 워크플로가 사흘간 멈춤 — 그 원인 중 하나)
    #
    #   8회/일 × 3분 = 24분/일 = 월 720분  ← 크롤만
    #   4회/일 × 3분 = 12분/일 = 월 360분  ← 지금
    #   나머지 워크플로 합계가 월 ~360분이라, 이 저장소 전체가 월 ~720분에 든다.
    #
    # 왜 균등 간격이 아닌가: 손님은 **방문한 저녁에** 리뷰를 쓴다.
    # 09/13/17/21로 균등하게 놓으면 21시 이후 리뷰가 다음날 아침까지 12시간 방치된다.
    # 마지막 회차를 23시로 밀어 그날 저녁 리뷰를 그날 안에 잡는다.
    #   낮 간격 5h·5h·4h · 심야 10h(23~09시, 리뷰가 거의 안 달리는 시간)
    #
    # 로드맵의 "30분 이하"는 무료 티어로 불가능하다 — 유료 전환하면 간격부터 되돌릴 것.
    - cron: '0 0,5,10,14 * * *'
  workflow_dispatch: {} # 수동 실행(테스트)용

concurrency:
  group: review-crawl
  cancel-in-progress: false

# 실패 알림(이슈 생성 → 소유자 이메일)용 최소 권한
permissions:
  contents: read
  issues: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    # 25분 — 실제 크롤은 매장당 20초 안팎이지만 `playwright install --with-deps`가
    # 러너 상태에 따라 10분 넘게 걸린다(2026-08-05 실측: 설치 10분32초 / 크롤 19초 / 플레이스 2초).
    # 15분이면 여유가 3분대뿐이라 파일럿 8매장에서 타임아웃으로 그 회차가 통째로 날아간다.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 의존성 설치 (워크스페이스)
        run: npm install

      # 브라우저 바이너리를 캐시한다 — **여기가 병목이었다.**
      # 실측(2026-08-19): 설치가 24초·32초·268초로 들쭉날쭉인데 정작 크롤은 60초다.
      # 즉 회차 시간의 대부분이 매번 같은 걸 다시 받는 데 쓰였다.
      # 캐시가 맞으면 이 단계가 사실상 0이 되고, 그만큼 **더 자주 돌릴 수 있다**
      # (부정 리뷰를 늦게 아는 게 이 서비스에서 가장 비싼 지연이다).
      - name: Playwright 브라우저 캐시
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # package-lock이 바뀌면(=playwright 버전이 바뀔 수 있으면) 새로 받는다
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # 캐시가 맞아도 --with-deps의 OS 라이브러리는 러너에 없을 수 있어 그것만 따로 깐다(수 초).
      - name: Playwright Chromium 설치
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            echo "캐시 적중 — 브라우저 다운로드 건너뜀"
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: 리뷰 크롤 실행
        working-directory: backend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 부정 리뷰를 **사장님 폰으로** 바로 보내기 위한 키(없으면 알림만 건너뛴다)
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
        # ⚠️ pipefail 필수 — tee를 거치면 파이프라인 종료코드가 tee의 것이 되어
        #    스크립트가 exit 1 해도 성공으로 찍힌다(매장 실패가 조용히 묻힌다).
        shell: bash
        run: |
          set -o pipefail
          npx tsx src/crawl-reviews.ts 2>&1 | tee /tmp/review.log

      - name: 부정 리뷰 알림 — 텔레그램이 없으면 이슈로
        # 크롤이 실패했어도 이미 수집된 부정 리뷰는 알려야 한다
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f /tmp/review.log ] || exit 0
          N=$(sed -n 's/.*신규 부정 리뷰 알림 대상 총 \([0-9]\+\)건.*/\1/p' /tmp/review.log | tail -1)
          N=${N:-0}
          SENT=$(grep -c '텔레그램 알림 발송' /tmp/review.log || true)
          # 텔레그램으로 이미 갔으면 중복 알림 안 만든다
          if [ "$N" = "0" ] || [ "$SENT" != "0" ]; then
            echo "부정 리뷰 알림 불필요 (대상 $N · 텔레그램 발송 $SENT)"; exit 0
          fi
          TITLE="🔴 부정 리뷰 ${N}건 — $(TZ=Asia/Seoul date +%Y-%m-%d)"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY=$(printf '답글이 아직 없는 아쉬운 리뷰가 %s건 있습니다. 늦을수록 손해가 커지니 사장님께 바로 알려주세요.\n\n대시보드 맨 위에도 표시됩니다: https://marketing-allinone.vercel.app/reviews\n\n(운영자 텔레그램 토큰이 설정되면 이 이슈 대신 텔레그램으로 갑니다)\n\n로그: %s' "$N" "$RUN_URL")
          COUNT=$(gh issue list -R "${{ github.repository }}" --state open --search "\"$TITLE\" in:title" --json number --jq 'length')
          if [ "$COUNT" = "0" ]; then
            gh issue create -R "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi

      - name: 플레이스 정보 크롤 (메뉴·영업시간 → 콘텐츠 사실 주입, 7일 멱등)
        # 리뷰 크롤이 실패(일부 매장 실패 포함)해도 반드시 돈다.
        # 둘은 독립된 일인데 순서 때문에 묶이면, 한 매장 리뷰 실패가
        # 전 매장의 메뉴·영업시간 갱신까지 막아 글 품질이 조용히 낡는다.
        if: ${{ !cancelled() }}
        working-directory: backend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx src/crawl-place.ts

      # 24/7 무인 운영: 실패하면 GitHub 이슈 생성 → 소유자에게 이메일 알림.
      # 하루 3회 도는 크론이라 같은 날 중복 이슈는 만들지 않는다.
      - name: 실패 알림 — 이슈 생성
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="🔴 리뷰 수집 크론 실패 — $(TZ=Asia/Seoul date +%Y-%m-%d)"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY=$(printf '자동 알림: 리뷰 크롤이 실패했습니다. 다음 회차(하루 3회)가 자동 재시도합니다. 연속 실패 시 네이버 마크업 변경 가능성을 확인하세요.\n\n로그: %s' "$RUN_URL")
          COUNT=$(gh issue list -R "${{ github.repository }}" --state open --search "\"$TITLE\" in:title" --json number --jq 'length')
          if [ "$COUNT" = "0" ]; then
            gh issue create -R "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi
