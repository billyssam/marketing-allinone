name: 리뷰 자동 수집

# 매일 09:00 KST(00:00 UTC) 리뷰 크롤 → 감정분석 → reviews 저장 → 부정리뷰 텔레그램 알림.
# 부수효과: 매일 DB 쓰기 활동 → Supabase 무료 프로젝트 자동 일시정지 방지.
on:
  schedule:
    # 09:00 / 12:00 / 18:00 KST — 신규 온보딩 매장도 몇 시간 내 리뷰·플레이스 사실 확보
    # (리뷰 upsert·플레이스 7일 체크 모두 멱등이라 추가 실행 무해)
    - cron: '0 0 * * *'
    - cron: '0 3 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch: {} # 수동 실행(테스트)용

concurrency:
  group: review-crawl
  cancel-in-progress: false

# 실패 알림(이슈 생성 → 소유자 이메일)용 최소 권한
permissions:
  contents: read
  issues: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 의존성 설치 (워크스페이스)
        run: npm install

      - name: Playwright Chromium 설치
        run: npx playwright install --with-deps chromium

      - name: 리뷰 크롤 실행
        working-directory: backend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npx tsx src/crawl-reviews.ts

      - name: 플레이스 정보 크롤 (메뉴·영업시간 → 콘텐츠 사실 주입, 7일 멱등)
        # 리뷰 크롤이 실패(일부 매장 실패 포함)해도 반드시 돈다.
        # 둘은 독립된 일인데 순서 때문에 묶이면, 한 매장 리뷰 실패가
        # 전 매장의 메뉴·영업시간 갱신까지 막아 글 품질이 조용히 낡는다.
        if: ${{ !cancelled() }}
        working-directory: backend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx src/crawl-place.ts

      # 24/7 무인 운영: 실패하면 GitHub 이슈 생성 → 소유자에게 이메일 알림.
      # 하루 3회 도는 크론이라 같은 날 중복 이슈는 만들지 않는다.
      - name: 실패 알림 — 이슈 생성
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="🔴 리뷰 수집 크론 실패 — $(TZ=Asia/Seoul date +%Y-%m-%d)"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY=$(printf '자동 알림: 리뷰 크롤이 실패했습니다. 다음 회차(하루 3회)가 자동 재시도합니다. 연속 실패 시 네이버 마크업 변경 가능성을 확인하세요.\n\n로그: %s' "$RUN_URL")
          COUNT=$(gh issue list -R "${{ github.repository }}" --state open --search "\"$TITLE\" in:title" --json number --jq 'length')
          if [ "$COUNT" = "0" ]; then
            gh issue create -R "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi
